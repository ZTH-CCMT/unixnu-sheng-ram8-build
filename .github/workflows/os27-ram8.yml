name: UniXNU sheng iPadOS 27 RAM 8 GiB V5.3 WebKit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sheng-os27-ram8-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          path: pipeline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: db32481cd5f17c98244a1f96eb00e41753e09987
          path: UniXNU
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU-sheng
          ref: c7a034617b94e4f0826b8eb70db6bc612e1aa093
          path: device
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/uefi-sheng
          ref: 66421cb7bb5694843aec8de1ca3d1de4c20cca38
          path: uefi-sheng
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU-sm8550-common
          ref: 97665e28578483082b674e8375a8fa65f4cf49cf
          path: UniXNU-sm8550-common
          persist-credentials: false
      - name: Apply verified local source overlay
        run: |
          python3 pipeline/ci/materialize.py --top "$GITHUB_WORKSPACE"
          python3 -B -m unittest discover -s UniXNU/kits/XnuPrelink -p 'test_*.py'
          python3 device/scripts/check-bluetooth-platform.py
          python3 device/scripts/extract-files.py --section Keyboard
      - name: Install author build dependencies
        run: |
          brew install dtc llvm lld cmake mtools ninja glslang shaderc spirv-tools bison pkgconf rustup unifdef
          top="$GITHUB_WORKSPACE"
          # Use the same ARM64 extras release as the working GitHub runner.
          tools="$top/tools"
          mkdir -p "$tools"
          archive="$tools/ipsw_3.1.745_macOS_arm64_extras.tar.gz"
          curl --fail --show-error --silent --location --retry 3 --output "$archive" \
            https://github.com/blacktop/ipsw/releases/download/v3.1.745/ipsw_3.1.745_macOS_arm64_extras.tar.gz
          printf '%s  %s\n' dbc517ec63a1f9e0f77dcbd2638525d049ee99f3a936278c9176b4c87dcc1c45 "$archive" \
            | shasum -a 256 -c -
          tar -xzf "$archive" -C "$tools" ipsw
          export PATH="$tools:$(brew --prefix rustup)/bin:$HOME/.cargo/bin:$(brew --prefix llvm)/bin:$(brew --prefix lld)/bin:$(brew --prefix bison)/bin:$PATH"
          ipsw version
          rustup toolchain install 1.98.0 --profile minimal --component rust-src
          cargo +1.98.0 --version
          printf '%s\n' "$tools" "$(brew --prefix rustup)/bin" "$HOME/.cargo/bin" "$(brew --prefix llvm)/bin" "$(brew --prefix lld)/bin" "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
      - name: Build and verify generic boot handoff
        id: native
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 pipeline/ci/native_build.py --top "$GITHUB_WORKSPACE"
      - name: Report kernel linker and prelink geometry
        if: always()
        env:
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
        run: |
          build=UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27
          log="$build/logs/kernel.log"
          if [ "$NATIVE_OUTCOME" = failure ] && [ -f "$log" ]; then
            sed -n '/^Undefined symbols for architecture/,/^ld: symbol(s) not found/p' "$log"
          fi
          native="$build/tree/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
          cache=UniXNU/out/ipsw/24A446/kernelcache.decompressed
          if [ -f "$native" ] && [ -f "$cache" ]; then
            python3 -B pipeline/ci/prelink_budget.py UniXNU device/board.toml "$cache" "$native"
          fi
      - name: Upload verified generic boot handoff
        uses: actions/upload-artifact@v4
        with:
          name: os27-ram8-v5.3-webkit-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: os27-ram8-handoff/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
